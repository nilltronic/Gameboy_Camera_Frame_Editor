<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<style>
body {
  font-family: monospace;
  background: #9bbc0f; /* matches the printer's own GB-green palette */
  color: #0f380f;
  margin: 0;
  padding: 24px 16px 60px;
}
h1 {
  text-align: center;
  margin: 0 0 6px;
}
p.sub {
  text-align: center;
  max-width: 560px;
  margin: 0 auto 24px;
  line-height: 1.5;
}
.tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}
.tab {
  font-family: monospace;
  font-size: 13px;
  padding: 8px 16px;
  background: #8bac0f;
  border: 2px solid #0f380f;
  border-radius: 6px;
  color: #0f380f;
  cursor: pointer;
}
.tab.active {
  background: #0f380f;
  color: #9bbc0f;
}
#status {
  text-align: center;
  margin-bottom: 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  max-width: 1100px;
  margin: 0 auto;
}
.grid.hidden {
  display: none;
}
.card {
  background: #8bac0f;
  border: 2px solid #0f380f;
  border-radius: 6px;
  padding: 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.card img {
  width: 100%;
  max-width: 144px;
  image-rendering: pixelated;
  background: #fff;
  border: 1px solid #0f380f;
  margin-bottom: 8px;
}
.card .name {
  font-size: 12px;
  font-weight: bold;
  word-break: break-word;
  margin-bottom: 4px;
}
.card .caption {
  font-size: 11px;
  word-break: break-word;
  margin-bottom: 8px;
  flex-grow: 1;
}
.card a.download {
  display: inline-block;
  font-size: 12px;
  padding: 6px 10px;
  background: #0f380f;
  color: #9bbc0f;
  text-decoration: none;
  border-radius: 4px;
}
.card a.download:hover {
  opacity: 0.85;
}
.empty {
  text-align: center;
  max-width: 500px;
  margin: 0 auto;
  line-height: 1.5;
}
a.back {
  display: block;
  text-align: center;
  margin-top: 32px;
  color: #0f380f;
}
</style>
</head>
<body>

<h1>Gallery</h1>
<p class="sub">
  Photos and frames shared by other printer owners.
  Want to add your own? <a href="https://github.com/nilltronic/Gameboy_Camera_Frame_Editor/issues/new?template=gallery-submission.yml">Submit here</a>.
</p>

<div class="tabs">
  <div class="tab active" data-type="Camera photo">Camera Photos</div>
  <div class="tab" data-type="Custom frame">Custom Frames</div>
</div>

<div id="status">Loading gallery&hellip;</div>

<div id="grid-Camera photo" class="grid"></div>
<div id="grid-Custom frame" class="grid hidden"></div>

<a class="back" href="index.html">&larr; Back to the index</a>

<script>
// ------------------------------------------------------------------
// Set this to "your-github-username/your-repo-name" — the repo that
// has a gallery/gallery.json file (written by the gallery-submission
// GitHub Action) and a gallery/images folder alongside it.
// ------------------------------------------------------------------
var REPO = "nilltronic/Gameboy_Camera_Frame_Editor";
var BRANCH = "main";
var GALLERY_JSON_URL = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/gallery/gallery.json";
var RAW_BASE = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/";

var statusEl = document.getElementById('status');
var grids = {
  "Camera photo": document.getElementById('grid-Camera photo'),
  "Custom frame": document.getElementById('grid-Custom frame')
};

// Tab switching
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    var type = tab.getAttribute('data-type');
    Object.keys(grids).forEach(function(key) {
      grids[key].classList.toggle('hidden', key !== type);
    });
  });
});

fetch(GALLERY_JSON_URL)
  .then(function(res) {
    if (!res.ok) throw new Error('Could not load gallery.json (' + res.status + ')');
    return res.json();
  })
  .then(function(entries) {
    if (!Array.isArray(entries) || entries.length === 0) {
      statusEl.textContent = 'No submissions yet — be the first!';
      return;
    }

    // Newest first
    entries.sort(function(a, b) {
      return new Date(b.submittedAt) - new Date(a.submittedAt);
    });

    var counts = { "Camera photo": 0, "Custom frame": 0 };

    entries.forEach(function(entry) {
      var grid = grids[entry.type];
      if (!grid) return; // unknown type, skip safely

      counts[entry.type]++;

      var card = document.createElement('div');
      card.className = 'card';

      var imgUrl = RAW_BASE + entry.image;

      var img = document.createElement('img');
      img.src = imgUrl;
      img.alt = entry.name || 'Gallery submission';
      img.loading = 'lazy';

      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = entry.name || 'Anonymous';

      var caption = document.createElement('div');
      caption.className = 'caption';
      caption.textContent = entry.caption || '';

      var link = document.createElement('a');
      link.className = 'download';
      link.href = imgUrl;
      link.download = entry.image.split('/').pop();
      link.textContent = 'Download';

      card.appendChild(img);
      card.appendChild(name);
      if (entry.caption) card.appendChild(caption);
      card.appendChild(link);
      grid.appendChild(card);
    });

    statusEl.textContent =
      counts["Camera photo"] + ' photo' + (counts["Camera photo"] === 1 ? '' : 's') +
      ', ' + counts["Custom frame"] + ' frame' + (counts["Custom frame"] === 1 ? '' : 's');
  })
  .catch(function(err) {
    statusEl.textContent = 'Could not load the gallery (' + err.message + ').';
  });
</script>

</body>
</html>
