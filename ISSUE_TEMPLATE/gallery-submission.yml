name: Gallery Submission
description: Share a Game Boy Camera photo or frame with the gallery
title: "[Gallery] "
labels: ["gallery-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! Upload your image below — drag and drop works right in this box.
        Please keep submissions to your own Game Boy Camera photos or frames you designed.

  - type: input
    id: display-name
    attributes:
      label: Your name / handle
      description: Shown as the credit under your image
      placeholder: e.g. nilltronic
    validations:
      required: true

  - type: dropdown
    id: submission-type
    attributes:
      label: Submission type
      options:
        - Camera photo
        - Custom frame
    validations:
      required: true

  - type: textarea
    id: image
    attributes:
      label: Image
      description: Drag and drop your image file here (or paste it)
    validations:
      required: true

  - type: input
    id: caption
    attributes:
      label: Caption (optional)
      placeholder: A short note about the image
    validations:
      required: false
