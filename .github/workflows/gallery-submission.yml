name: Process Gallery Submission

on:
  issues:
    types: [labeled]

jobs:
  add-to-gallery:
    if: github.event.label.name == 'gallery-submission'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue form
        id: parse
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/gallery-submission.yml

      - name: Download and save image
        id: fetch
        run: |
          IMAGE_URL=$(echo '${{ steps.parse.outputs.issueparser_image }}' | grep -oP '(?<=src=")https://[^"]+')
          FILENAME="gallery/images/$(date +%s)-${{ github.event.issue.number }}.png"
          mkdir -p gallery/images
          curl -sL "$IMAGE_URL" -o "$FILENAME"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Append to gallery.json
        run: |
          node .github/scripts/append-gallery-entry.js \
            --file "gallery/gallery.json" \
            --image "${{ steps.fetch.outputs.filename }}" \
            --name "${{ steps.parse.outputs.issueparser_display-name }}" \
            --type "${{ steps.parse.outputs.issueparser_submission-type }}" \
            --caption "${{ steps.parse.outputs.issueparser_caption }}" \
            --issue "${{ github.event.issue.number }}"

      - name: Commit changes
        run: |
          git config user.name "gallery-bot"
          git config user.email "actions@github.com"
          git add gallery/
          git commit -m "Add gallery submission from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "Thanks — your image is now live in the gallery! 🎉"
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
